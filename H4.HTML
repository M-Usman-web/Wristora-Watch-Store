<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Hamid!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      color: #fff;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 60px;
      animation: pop 1s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.1);
      }
    }

    .balloons {
      margin-top: 50px;
      font-size: 40px;
      animation: float 2s ease-in-out infinite alternate;
    }

    @keyframes float {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-20px);
      }
    }

    .msg {
      font-size: 24px;
      margin-top: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cake {
      font-size: 80px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Happy Birthday Hamid! 🎉</h1>
    <div class="balloons">🎈🎈🎈🎈🎈</div>
    <p class="msg">May your day be filled with joy, love, and lots of cake! 🎂 You're an amazing  friend and you deserve the best today and always.May you live long (AMEEN)</p>
    <div class="cake">🎂</div>
  </div>
</body>
</html>
