<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Wristora Watch Store</title>
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="Logo.png" alt="Wristora Logo" class="logo-img">
      <h1>Wristora</h1>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="Watches.html">Watches</a>
      <a href="contact.html">Contact Us</a>
      
    </nav>
    
  </header>

    
  <div class="contact-container">
    <h2>Contact Us</h2>
 
</header>
    <p>If you have any questions or feedback, feel free to reach out!</p>

    <!-- Business Info Section -->
    <div class="contact-info">
      <p><i class="fas fa-envelope"></i> Email: support@wristora.com</p>
      <p><i class="fas fa-phone"></i> Phone: +92 300 1234567</p>
      <p><i class="fas fa-map-marker-alt"></i> Address: 123 Market Road, Lahore, Pakistan</p>
    </div>

    <!-- Contact Form -->
    <form class="contact-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Subject (optional)">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Wristora Watch Store. All rights reserved.</p>
  </footer>

</body>
</html>
